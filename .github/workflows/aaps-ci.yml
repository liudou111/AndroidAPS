name: AAPS CI NoGDrive
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build Variant
        required: true
        default: fullRelease
        type: choice
        options:
          - fullRelease
          - fullDebug
          - pumpRelease
          - pumpDebug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Missing required keystore secrets!"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Sign APK
        run: |
          ./gradlew assemble${{ github.event.inputs.variant }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: keystore.jks

      - name: Upload signed APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-${{ github.event.inputs.variant }}
          path: app/build/outputs/apk/**/*.apk
